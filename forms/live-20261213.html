<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>バトルフェイス富安_LIVE予約フォーム</title>
  <meta name="description" content="バンドライブの参加予約を行うためのフォームです。">
  <link rel="stylesheet" href="../assets/css/style.css">
<base target="_blank">
</head>
<body>
  <header class="page-header">
    <div class="container">
      <p class="page-kicker">LIVE RESERVATION</p>
      <h1>HeartLand pre.HOMEGAME vol.20</h1>
      <p class="page-lead">必要事項を入力して、予約を送信してください。</p>
    </div>
  </header>

  <main class="container">
    <section class="event-info" aria-labelledby="event-heading">
      <h2 id="event-heading" class="sr-only">公演情報</h2>
      <dl class="event-meta">
        <div class="event-meta-row">
          <dt>公演日</dt>
          <dd>2026.12.13(日)</dd>
        </div>
        <div class="event-meta-row">
          <dt>開催場所</dt>
          <dd>愛知県 新栄ハートランド</dd>
        </div>
        <div class="event-meta-row">
          <dt>OPEN / START</dt>
          <dd>17:30 / 18:00</dd>
        </div>
        <div class="event-meta-row">
          <dt>出演</dt>
          <dd>カモメカモネ / ADANARI / ノーリプ / Genthru / バトルフェイス富安 / as time goes on</dd>
        </div>
        <div class="event-meta-row">
          <dt>チケット</dt>
          <dd>前売り：￥2,400 / 当日：￥2,900 / Drink：￥600</dd>
        </div>
      </dl>
    </section>
    <!--
      Google Formsへ送信する場合は、actionのFORM_IDと各name="entry.XXXXXXXX"を、
      実際のフォームの送信先URL・エントリーIDへ置き換える。
    -->
    <form id="reservation-form" class="reservation-form" action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSelsSGmGBs6QM5jqErUDJi_N91Kq5aBleQgoty9mkNzshut1A/formResponse" method="post">
      <section class="form-section" aria-labelledby="guest-information">

        <div class="form-grid">
          <div class="form-field">
            <label for="guest-name">お名前 <span class="required-mark">必須</span></label>
            <input id="guest-name" name="entry.1076069704" type="text" autocomplete="name" placeholder="例：バトルフェイス富安" required>
          </div>

          <div class="form-field">
            <label for="guest-email">メールアドレス <span class="required-mark">必須</span></label>
            <input id="guest-email" name="entry.1202400113" type="email" autocomplete="email" placeholder="例：battlefacetomiyasu@mail.com" required>
          </div>
        </div>
      </section>

      <section class="form-section" aria-labelledby="reservation-details">

        <div class="form-stack">
          <div class="form-grid form-grid--two-columns">
            <div class="form-field">
              <label for="ticket-count">予約枚数 <span class="required-mark">必須</span></label>
              <select id="ticket-count" name="entry.237744567" required>
                <option value="" selected disabled>選択してください</option>
                <option value="1">1枚</option>
                <option value="2">2枚</option>
                <option value="3">3枚</option>
                <option value="4">4枚</option>
                <option value="5">5枚</option>
              </select>
            </div>
          </div>
        </div>
      </section>
      <div class="form-actions">
        <button type="submit" id="submit-btn">予約を送信する</button>
        <p id="form-message" class="submit-note" role="status" aria-live="polite"></p>
      </div>
    </form>
  </main>

  <footer class="page-footer">
    <div class="container">
      <p>ご不明な点がある場合は、bftomiyasu@gmail.com へお問い合わせください。</p>
    </div>
  </footer>
</body>
</html>


<script>
  const form = document.getElementById("reservation-form");
  const submitBtn = document.getElementById("submit-btn");
  const messageEl = document.getElementById("form-message");

  form.addEventListener("submit", async (e) => {
    e.preventDefault(); // Googleフォームの完了ページへ飛ばないようにする

    submitBtn.disabled = true;
    submitBtn.textContent = "送信中...";
    messageEl.textContent = "";

    const formData = new FormData(form);

    try {
      await fetch(form.action, {
        method: "POST",
        mode: "no-cors", // Googleフォーム宛てのクロスオリジン送信に必要
        body: formData,
      });

      // no-cors だと成否のステータスは読めないため、送信完了として表示
      form.reset();
      messageEl.textContent = "予約を受け付けました！当日お会いできるのを楽しみにしています。";
    } catch (err) {
      messageEl.textContent = "送信に失敗しました。時間をおいて再度お試しいただくか、メールでご連絡ください。";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "予約を送信する";
    }
  });
</script>
