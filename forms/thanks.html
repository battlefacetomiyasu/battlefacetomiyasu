<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>予約完了 | バトルフェイス富安_LIVE予約フォーム</title>
  <meta name="description" content="ライブ予約の完了画面です。">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="page-header">
    <div class="container">
      <p class="page-kicker">RESERVATION COMPLETE</p>
      <h1>予約を受け付けました</h1>
    </div>
  </header>

  <main class="container thanks-main">
    <p class="thanks-message">
      予約を受け付けました！当日お会いできるのを楽しみにしています。
    </p>
    <p class="thanks-sub">
      ※自動返信メールが届かない場合や変更がある場合は、フッターの連絡先までお問い合わせください。
    </p>

    <div class="thanks-actions">
      <button type="button" id="close-tab-btn" class="thanks-close-btn">この画面を閉じる</button>
      <p id="close-note" class="submit-note" role="status" aria-live="polite"></p>
    </div>
  </main>

  <footer class="page-footer">
    <div class="container">
      <p>ご不明な点がある場合は、bftomiyasu@gmail.com へお問い合わせください。</p>
    </div>
  </footer>

  <script>
    const closeBtn = document.getElementById("close-tab-btn");
    const closeNote = document.getElementById("close-note");

    closeBtn.addEventListener("click", () => {
      window.close();
      // ブラウザ制限で閉じられなかった場合のフォールバック案内
      setTimeout(() => {
        if (!window.closed) {
          closeNote.textContent = "自動で閉じられない場合は、ブラウザのタブを閉じてください。";
        }
      }, 150);
    });
  </script>
</body>
</html>
